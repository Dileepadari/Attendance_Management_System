<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class report - RGUKT Attendance</title>
  <meta name="description" content="Attendance percentages for a whole class in one subject.">
  <link rel="icon" href="assets/img/logo-mark.png">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main class="page" id="main">
    <div class="page-head">
      <h1>Class report</h1>
      <p>Every student in one subject, ranked, with the shortfalls flagged.</p>
    </div>

    <section class="card">
      <form id="picker-form">
        <div class="field-grid">
          <div class="field">
            <label for="course">Course</label>
            <select id="course"></select>
          </div>
          <div class="field">
            <label for="semester">Semester</label>
            <select id="semester"></select>
          </div>
          <div class="field">
            <label for="section">Section</label>
            <select id="section"></select>
          </div>
          <div class="field">
            <label for="subject">Subject</label>
            <select id="subject"></select>
          </div>
          <div class="field">
            <button type="submit" class="btn btn-primary" id="run">Build report</button>
          </div>
        </div>
      </form>
    </section>

    <div id="status"></div>

    <section class="card" id="result" hidden>
      <div class="card-head">
        <h2 id="result-title"></h2>
        <div class="btn-row">
          <label class="roster-count">
            <input type="checkbox" id="only-short"> Only below threshold
          </label>
          <button type="button" class="btn btn-sm" id="export">Export CSV</button>
          <button type="button" class="btn btn-sm" id="print">Print</button>
        </div>
      </div>

      <dl class="stat-row" id="totals"></dl>

      <div class="table-wrap">
        <table class="data">
          <caption class="sr-only">Attendance by student</caption>
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col"><button type="button" class="link-button" data-sort="present">Present</button></th>
              <th scope="col"><button type="button" class="link-button" data-sort="absent">Absent</button></th>
              <th scope="col"><button type="button" class="link-button" data-sort="percentage">Attendance</button></th>
            </tr>
          </thead>
          <tbody id="student-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="sheet-card" hidden>
      <div class="card-head">
        <h2>The sheet itself</h2>
        <a class="btn btn-sm" id="sheet-open" target="_blank" rel="noopener noreferrer">Open in a tab</a>
      </div>
      <p class="roster-count">Read-only view published from the workbook. Everything above is
        calculated from the same data.</p>
      <iframe class="sheet-frame" id="sheet-frame" title="Published attendance sheet" loading="lazy"></iframe>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="assets/js/pages/class-report.js"></script>
</body>
</html>
