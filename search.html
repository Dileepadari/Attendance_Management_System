<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student report - RGUKT Attendance</title>
  <meta name="description" content="Attendance across every subject for one student.">
  <link rel="icon" href="assets/img/logo-mark.png">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main class="page" id="main">
    <div class="page-head">
      <h1>Student report</h1>
      <p>Subject-by-subject attendance for one student, with the dates they missed.</p>
    </div>

    <section class="card">
      <form id="picker-form">
        <div class="field-grid">
          <div class="field">
            <label for="course">Course</label>
            <select id="course"></select>
          </div>
          <div class="field">
            <label for="semester">Semester</label>
            <select id="semester"></select>
          </div>
          <div class="field">
            <label for="section">Section</label>
            <select id="section"></select>
          </div>
          <div class="field">
            <label for="student">Student</label>
            <select id="student"><option value="">Load a class first</option></select>
            <span class="hint" id="student-hint">Pick a class to list its students</span>
          </div>
          <div class="field">
            <button type="submit" class="btn btn-primary" id="run">Build report</button>
          </div>
        </div>
      </form>
    </section>

    <div id="status"></div>

    <section class="card" id="result" hidden>
      <div class="card-head">
        <h2 id="result-title"></h2>
        <button type="button" class="btn btn-sm" id="export">Export CSV</button>
      </div>

      <dl class="stat-row" id="totals"></dl>

      <div class="table-wrap">
        <table class="data">
          <caption class="sr-only">Attendance by subject</caption>
          <thead>
            <tr>
              <th scope="col">Subject</th>
              <th scope="col">Present</th>
              <th scope="col">Absent</th>
              <th scope="col">Sessions</th>
              <th scope="col">Attendance</th>
              <th scope="col">Dates missed</th>
            </tr>
          </thead>
          <tbody id="subject-rows"></tbody>
          <tfoot id="subject-total"></tfoot>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="assets/js/pages/student-report.js"></script>
</body>
</html>
