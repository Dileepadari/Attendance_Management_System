<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark attendance - RGUKT Attendance</title>
  <meta name="description" content="Mark a class register and file it to the subject sheet.">
  <link rel="icon" href="assets/img/logo-mark.png">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main class="page" id="main">
    <div class="page-head">
      <h1>Mark attendance</h1>
      <p>Pick the class and subject, then file the register for one period.</p>
    </div>

    <section class="card">
      <form id="picker-form">
        <div class="field-grid">
          <div class="field">
            <label for="course">Course</label>
            <select id="course"></select>
          </div>
          <div class="field">
            <label for="semester">Semester</label>
            <select id="semester"></select>
          </div>
          <div class="field">
            <label for="section">Section</label>
            <select id="section"></select>
          </div>
          <div class="field">
            <label for="subject">Subject</label>
            <select id="subject"></select>
          </div>
          <div class="field">
            <button type="submit" class="btn btn-primary" id="load">Load register</button>
          </div>
        </div>
      </form>
    </section>

    <div id="status"></div>

    <section class="card" id="register" hidden>
      <div class="card-head">
        <h2 id="register-title"></h2>
        <span class="roster-count" id="roster-count"></span>
      </div>

      <form id="attendance-form">
        <div class="field-grid">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="field">
            <label for="period">Period</label>
            <select id="period" required></select>
          </div>
        </div>

        <div class="roster-toolbar">
          <div class="field grow">
            <label for="filter" class="sr-only">Filter students</label>
            <input type="search" id="filter" placeholder="Filter by name or ID" aria-label="Filter students">
          </div>
          <button type="button" class="btn btn-sm" id="all-present">All present</button>
          <button type="button" class="btn btn-sm" id="all-absent">All absent</button>
        </div>

        <div class="roster-row roster-head">
          <span>#</span><span>ID</span><span>Name</span><span>Attendance</span>
        </div>
        <ul class="roster" id="roster"></ul>

        <div class="sticky-actions">
          <span class="tally" id="tally"></span>
          <div class="btn-row">
            <button type="button" class="btn" id="discard">Discard draft</button>
            <button type="submit" class="btn btn-primary" id="save">Save register</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="assets/js/pages/attendance.js"></script>
</body>
</html>
