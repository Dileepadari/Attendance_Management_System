<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - RGUKT Attendance</title>
  <meta name="description" content="Sign in to the RGUKT Srikakulam attendance register.">
  <link rel="icon" href="assets/img/logo-mark.png">
  <link rel="stylesheet" href="assets/css/app.css">
  <!-- Applies the saved theme before first paint. Must stay render-blocking: a
       deferred module would let the wrong theme flash on every navigation. -->
  <script src="assets/js/theme-init.js"></script>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-badge"><img src="assets/img/logo-mark.png" alt="" class="logo-mono"></span>
        <span class="brand-text">
          <strong>RGUKT Attendance</strong>
          <small>Srikakulam Campus</small>
        </span>
        <span id="theme-mount"></span>
      </div>

      <h1>Sign in</h1>

      <div id="status"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submit">Sign in</button>
      </form>

      <p class="auth-note" id="demo-hint" hidden>
        Demo credentials: <code>admin</code> / <code>admin</code>.
        Change them before deploying - see DEVDOC.md.
      </p>
    </div>
  </main>

  <script type="module" src="assets/js/pages/login.js"></script>
</body>
</html>
